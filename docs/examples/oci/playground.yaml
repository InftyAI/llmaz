apiVersion: llmaz.io/v1alpha1
kind: OpenModel
metadata:
  name: qwen2-0--5b
spec:
  familyName: qwen2
  source:
    # A model published as a CNCF ModelPack artifact (https://github.com/modelpack/model-spec)
    # in any OCI registry, following the protocol:
    # oci://<registry>/<repository>[:<tag>|@<digest>]
    uri: oci://ghcr.io/inftyai/qwen2-0.5b:latest
